[package]
name = "intentd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Intent activity daemon"

[lib]
path = "src/lib.rs"

[[bin]]
name = "intentd"
path = "src/main.rs"

[dependencies]
intent-types = { path = "../intent-types" }
intent-store = { path = "../intent-store" }
intent-capture = { path = "../intent-capture" }
intent-engine = { path = "../intent-engine" }
intent-llm = { path = "../intent-llm" }
intent-collectors = { path = "../intent-collectors" }
anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "matched-path"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
sd-notify = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "signal", "sync", "time", "net"] }
tower-http = { version = "0.6", default-features = false, features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "ansi"] }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = { version = "=4.17.0", default-features = false, features = ["z-with-tokio"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"
