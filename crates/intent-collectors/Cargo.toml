[package]
name = "intent-collectors"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
intent-types = { path = "../intent-types" }
notify = "8.2"
notify-debouncer-full = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "process", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

# Linux-only backends. Both are pure Rust (no libX11 / libdbus linkage).
[target.'cfg(target_os = "linux")'.dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["net"] }
x11rb = { version = "0.13", features = ["screensaver"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFString", "CFNumber"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGWindow", "CGEventSource", "CGEventTypes"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "test-util"] }
