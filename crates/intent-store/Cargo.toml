[package]
name = "intent-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
intent-types = { path = "../intent-types" }
rusqlite = { version = "0.42", features = ["bundled", "functions"] }
sqlite-vec = "0.1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = "0.2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
